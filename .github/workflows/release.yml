name: Release Installer

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: installer-${{ github.repository }}
  cancel-in-progress: false

jobs:
  installer:
    # Self-hosted macOS runner on the development Mac (Xcode 27, macOS 27).
    # Pin tighter with the custom label if desired: [self-hosted, macOS, macos-native]
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 90
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      P12_BASE64: ${{ secrets.DEVELOPER_ID_P12 }}
      P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: brew install pkgconf

      - name: Build pinned ntfs-3g
        run: ./scripts/build-libntfs.sh

      - name: Run engine tests
        run: ./scripts/run-engine-tests.sh

      # The certificate may already live in the runner's login keychain. When
      # the secret is present, import it into a temporary keychain instead and
      # restore the user's keychain search list afterwards.
      - name: Import Developer ID certificate
        if: env.P12_BASE64 != ''
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          security list-keychains -d user | sed 's/^[[:space:]]*//; s/"//g' > "$RUNNER_TEMP/keychains.txt"
          security create-keychain -p ci "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p ci "$KEYCHAIN"
          printf '%s' "$P12_BASE64" | base64 -D > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ci "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(cat "$RUNNER_TEMP/keychains.txt")
          rm -f "$RUNNER_TEMP/cert.p12"
          IDENTITY_HASH="$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | awk '/Developer ID Application/ {print $2; exit}')"
          if [ -z "$IDENTITY_HASH" ]; then
            echo "error: imported keychain contains no Developer ID Application identity" >&2
            exit 1
          fi
          echo "SIGN_IDENTITY=$IDENTITY_HASH" >> "$GITHUB_ENV"

      - name: Verify Developer ID identity
        run: |
          set -euo pipefail
          if ! security find-identity -v -p codesigning | grep -q "Developer ID Application"; then
            echo "error: no Developer ID Application identity available (set DEVELOPER_ID_P12 or install the certificate)" >&2
            exit 1
          fi
          security find-identity -v -p codesigning | grep "Developer ID Application" | head -2

      - name: Restore keychain list
        if: always()
        run: |
          set -uo pipefail
          if [ -f "$RUNNER_TEMP/keychains.txt" ]; then
            security list-keychains -d user -s $(cat "$RUNNER_TEMP/keychains.txt") 2>/dev/null || true
            rm -f "$RUNNER_TEMP/keychains.txt"
          fi
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" 2>/dev/null || true

      - name: Write App Store Connect key
        env:
          ASC_P8_BASE64: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/secrets"
          printf '%s' "$ASC_P8_BASE64" | base64 -D > "$RUNNER_TEMP/secrets/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/secrets/AuthKey.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/secrets/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Create Developer ID provisioning profiles
        run: ./scripts/create-dev-id-profiles.sh

      - name: Build signed Release app
        env:
          CONFIG: Release
        run: ./scripts/build-signed.sh

      - name: Verify tag matches app version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' \
            build/DerivedData/Build/Products/Release/MacNTFS.app/Contents/Info.plist)"
          if [ "$TAG" != "$VERSION" ]; then
            echo "error: tag v$TAG does not match app version $VERSION" >&2
            exit 1
          fi

      - name: Build notarized installer
        run: ./scripts/make-installer.sh

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/installer/*.dmg
          generate_release_notes: true
